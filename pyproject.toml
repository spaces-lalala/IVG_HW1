[project]
name = "lab1-ddpm"
version = "0.1.0"
description = "NYCU Image and Video Generation 2026 Fall - PA1: DDPM"
requires-python = ">=3.10,<3.11"
dependencies = [
    # torch 2.5.1 is the last release before torch.load() flipped its
    # weights_only default to True; 2d_plot_diffusion_todo/ddpm.py's load()
    # does not pass the flag, so staying on 2.5.x avoids that break.
    "torch==2.5.1",
    "torchvision==0.20.1",
    "scikit-learn==1.1.3",
    "scipy",
    "ipython==8.12.0",
    "jupyter==1.0.0",
    "matplotlib==3.6.0",
    # matplotlib-inline 0.2.x calls the private RcParams._get(), which only
    # exists in matplotlib >= 3.9. Keep 0.1.x so the notebook's inline backend works.
    "matplotlib-inline<0.2",
    "torch-ema==0.3",
    "tqdm==4.64.1",
    "jupyterlab==4.0.2",
    "jaxtyping==0.2.20",
    "pytorch-lightning",
    "dotmap",
    "numpy==1.26.0",
    "pytest==8.4.2",
]

[tool.uv]
# This repo is the assignment itself, not an installable package.
package = false

# CUDA wheels for the local RTX 4050 (sm_89) and the remote 3090 (sm_86).
# `explicit = true` keeps every other dependency on PyPI.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
